name: Build MSIX (Windows)

# Ручной запуск: Actions → Build MSIX (Windows) → Run workflow.
# Идентификаторы пакета берутся из репозиторных переменных
# (Settings → Secrets and variables → Actions → Variables):
#   MSIX_PACKAGE_NAME — Package/Identity/Name из Partner Center
#   MSIX_PUBLISHER    — Package/Identity/Publisher из Partner Center
# Пока переменные не заданы, собирается тестовый пакет.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install PySide6==6.12.0 pyinstaller==6.22.3

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Doska-3.1" `
            --icon doska_icon.ico --add-data "doska_icon.ico;." `
            --version-file version_info.txt doska_qt.py

      - name: Stage MSIX contents
        shell: pwsh
        env:
          MSIX_PACKAGE_NAME: ${{ vars.MSIX_PACKAGE_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          $pkgName = if ($env:MSIX_PACKAGE_NAME) { $env:MSIX_PACKAGE_NAME } else { "DoskaDevTest.Doska" }
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { "CN=DoskaDevTest" }
          New-Item -ItemType Directory -Path stage | Out-Null
          Copy-Item "dist\Doska-3.1.exe" "stage\Doska-3.1.exe"
          Copy-Item "store\Assets" "stage\Assets" -Recurse
          $m = Get-Content "store\AppxManifest.xml" -Raw
          $m = $m.Replace("{{PACKAGE_NAME}}", $pkgName)
          $m = $m.Replace("{{PUBLISHER}}", $publisher)
          $m = $m.Replace("{{PUBLISHER_DISPLAY}}", "Oleg Renev")
          Set-Content "stage\AppxManifest.xml" $m -Encoding UTF8

      - name: Pack MSIX
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName pack /d stage /p Doska-3.1.msix /nv
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed: $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: Doska-3.1-msix
          path: Doska-3.1.msix
